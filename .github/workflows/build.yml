name: Build

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_name: etrade-gl-macos
            binary: dist/etrade-gl
          - os: windows-latest
            artifact_name: etrade-gl-windows
            binary: dist/etrade-gl.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build binary
        run: pyinstaller etrade-gl.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.binary }}
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download macOS binary
        uses: actions/download-artifact@v4
        with:
          name: etrade-gl-macos
          path: release/macos

      - name: Download Windows binary
        uses: actions/download-artifact@v4
        with:
          name: etrade-gl-windows
          path: release/windows

      - name: Rename binaries
        run: |
          mv release/macos/etrade-gl   release/etrade-gl-macos
          mv release/windows/etrade-gl.exe release/etrade-gl-windows.exe

      - name: Generate tag
        id: tag
        run: echo "value=v$(date +'%Y.%m.%d')-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          files: |
            release/etrade-gl-macos
            release/etrade-gl-windows.exe
          generate_release_notes: true
